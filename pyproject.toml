[project]
name = "faultline"
version = "0.1.0"
description = "Find the silent failures in an AI agent, prove the fix, and stop them from coming back."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
    "kubernetes-asyncio>=36.1.0",
    "mcp>=2.3.0",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
faultline = "faultline:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
