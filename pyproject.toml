[project]
name = "scrimmage-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = ["scrimmage-core", "scrimmage"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
scrimmage-core = { workspace = true }
scrimmage = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
    "pyright>=1.1.414",
    "openai>=3.46",
    "httpx>=0.28",
    "vulture>=2.16",
    "import-linter>=2.15",
    "jsonschema>=4.26",
    "pytest-cov>=7.1",
    "coverage>=7.17",
    "langgraph>=1.2",
    "langchain-core>=1.7",
    "langchain-openai>=1.7",
    "mcp>=2.3.0",
    "fastmcp>=4.1.6",
    "pytest-xdist>=3.8.0",
]
docs = [
    "mkdocs-material>=9.8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "-p", "no:langsmith_plugin", "-n", "auto"]
filterwarnings = ["error"]
markers = [
    "design(tag): the design point this test proves, as a short public name",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages/scrimmage-core/src", "packages/scrimmage/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The allowlist is a list of names for vulture; each line is a bare attribute access.
"vulture_allowlist.py" = ["B018"]

[tool.pyright]
include = ["packages/scrimmage-core/src", "packages/scrimmage/src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# Product code is strict. A gate or adapter module, which reaches into a library's
# private functions, drops to standard with a "# pyright: standard" line at its top.
strict = ["packages/scrimmage-core/src", "packages/scrimmage/src"]

[tool.vulture]
paths = ["packages/scrimmage-core/src", "packages/scrimmage/src", "tests", "vulture_allowlist.py"]
# 60, not 80: vulture rates every unused function and method at 60.
min_confidence = 60

[tool.importlinter]
root_packages = ["scrimmage_core", "scrimmage"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Product code never imports test support"
type = "forbidden"
source_modules = ["scrimmage_core", "scrimmage"]
forbidden_modules = ["fakes", "conftest"]

[[tool.importlinter.contracts]]
name = "The marker works without the SDK installed"
type = "forbidden"
source_modules = ["scrimmage"]
forbidden_modules = ["scrimmage_core"]

[tool.coverage.run]
branch = true
# The marker package is still empty; it is measured from the slice that builds it.
source_pkgs = ["scrimmage_core"]
# The SDK runs inside each run's own program, so measure child processes too.
patch = ["subprocess"]
parallel = true
relative_files = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
