[project]
name = "faultline-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = ["faultline", "faultline-marker"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
faultline = { workspace = true }
faultline-marker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
    "pyright>=1.1.414",
]
