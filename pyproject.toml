[project]
name = "faultline-workspace"
version = "0.1.0"
description = "Workspace root: the faultline product and the lab that tests it."
requires-python = ">=3.12"
# Both members, so a plain `uv sync` installs the product and the lab.
dependencies = ["faultline", "faultline-lab"]

[tool.uv]
package = false

[tool.uv.sources]
faultline = { workspace = true }
faultline-lab = { workspace = true }

[tool.uv.workspace]
members = ["packages/faultline", "lab"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "opentelemetry-exporter-otlp-proto-common>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-semantic-conventions>=0.66b1",
    "protobuf>=7.36.2",
    "pydantic-ai-slim>=2.64.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["lab/tests"]
testpaths = ["packages/faultline/tests", "lab/tests", "tests"]

[tool.pyright]
include = ["packages/faultline/src", "packages/faultline/tests", "lab/src", "lab/tests", "tests"]
# The root contract test imports the span builder from the lab's tests.
extraPaths = ["lab/tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.ruff]
# First-party code for import sorting: the product and the lab.
src = ["packages/faultline/src", "lab/src"]

[tool.ruff.lint.flake8-bugbear]
# Frozen, so a shared default is safe.
extend-immutable-calls = ["faultline.config.Attributes"]

# The CI gate on the product/lab split. The AST tests in each package are the fast local check.
[tool.importlinter]
root_packages = ["faultline", "faultline_lab"]

[[tool.importlinter.contracts]]
name = "The product never imports the lab"
type = "forbidden"
source_modules = ["faultline"]
forbidden_modules = ["faultline_lab"]

[[tool.importlinter.contracts]]
name = "The lab never imports the product"
type = "forbidden"
source_modules = ["faultline_lab"]
forbidden_modules = ["faultline"]
