[project]
name = "faultline-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = ["faultline", "faultline-marker"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
faultline = { workspace = true }
faultline-marker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
    "pyright>=1.1.414",
    "openai>=3.46",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
src = ["packages/faultline/src", "packages/faultline-marker/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
