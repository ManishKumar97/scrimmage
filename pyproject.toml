[project]
name = "faultline-workspace"
version = "0.1.0"
description = "Workspace root: the faultline product and the lab that tests it."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/faultline", "lab"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["lab/tests"]
testpaths = ["packages/faultline/tests", "lab/tests"]

[tool.pyright]
include = ["packages/faultline/src", "packages/faultline/tests", "lab/src", "lab/tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.ruff]
# First-party code for import sorting: the product and the lab.
src = ["packages/faultline/src", "lab/src"]
