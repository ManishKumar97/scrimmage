[project]
name = "scrimmage"
version = "0.1.0.dev0"
description = "Fault injection for AI agents under test."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The Scrimmage MCP server. Pinned to one minor: its middleware list may change within 2.x.
mcp = ["mcp>=2.3,<2.4"]
# scrimmage cert: the throwaway authority and server certificate.
cert = ["cryptography>=46"]

[project.scripts]
scrimmage = "scrimmage_core.entry:main"
scrimmage-run = "scrimmage_core.run_command:main"
scrimmage-mcp = "scrimmage_core.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrimmage_core"]
