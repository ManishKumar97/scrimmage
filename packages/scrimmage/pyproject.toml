[project]
name = "scrimmage"
version = "0.1.0rc1"
description = "Fault injection for AI agents under test."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Documentation = "https://manishkumar97.github.io/scrimmage/"
Source = "https://github.com/ManishKumar97/scrimmage"
Issues = "https://github.com/ManishKumar97/scrimmage/issues"

[project.optional-dependencies]
# The Scrimmage MCP server. Pinned to one minor: its middleware list may change within 2.x.
mcp = ["mcp>=2.3,<2.4"]
# scrimmage cert: the throwaway authority and server certificate.
cert = ["cryptography>=46"]

[project.scripts]
scrimmage = "scrimmage.entry:main"
scrimmage-run = "scrimmage.run_command:main"
scrimmage-mcp = "scrimmage.mcp_server:main"

[build-system]
# Pinned: a byte-identical rebuild of a release needs the same hatchling that built it.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrimmage"]

# The sdist holds the package and nothing else that sits beside it in a working tree.
[tool.hatch.build.targets.sdist]
only-include = ["src", "pyproject.toml", "README.md", "LICENSE"]
