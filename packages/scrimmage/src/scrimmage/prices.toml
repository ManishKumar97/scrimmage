# Model prices in dollars per million tokens, standard tier, with the rates of the other service tiers
# under tiers.<name>.
# Checked by hand against OpenAI's pricing page on 22 November 2026; a price changes by a plain PR to
# this file.
# A team overrides or adds a model under [agent.prices] in scrimmage.toml.
# A [long] table holds the rates of a call with more than `above` input tokens. OpenAI charges the
# whole call at them, input and output, not only the tokens past the threshold.
# A tier with no long table costs its own rates at any length: the page lists no long rate for it.
# A missing cached_input costs the full input rate: a price that guesses must guess high.
# The fast tier is also priced under its old name, priority: OpenAI renamed priority processing to
# Fast mode on 30 July 2026 and accepts either name in a request, so a lookup of either finds fast.
# These are OpenAI's global rates; regional and FedRAMP endpoints charge 10% more on models released
# on or after 5 March 2026.
# Ultrafast for gpt-6.2-astra and gpt-6.2-sol is the page's list rate, 6 times Standard. Until
# 28 February 2027 OpenAI bills 3 times Standard, so these two tiers are twice the bill until then
# and exact after.
# Left out on purpose: gpt-5.6-sol, whose listed price is promotional until 30 November 2026 and has
# no list price on the page; the Batch tier, which is not a service_tier a reply names; flex for
# gpt-5.5-pro, which has no long rate on the page; and the trusted-access models.

[openai]
url = "https://developers.openai.com/api/docs/pricing"
as_of = "2026-11-22"

