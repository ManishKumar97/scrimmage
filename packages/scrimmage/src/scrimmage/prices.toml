# Anthropic's prices, in dollars per million tokens, standard speed, with fast mode under tiers.fast.
# Checked by hand against Anthropic's pricing page and fast mode page on 25 November 2026; a price
# changes by a plain PR to this file. A team overrides or adds a model under [agent.prices].
# A row's name is the Claude API model id, as the models page gives it. A dated snapshot, such as
# claude-opus-4-5-20251101, costs its family's row: -YYYYMMDD is dropped.
# Every row sets its cache writes as the page lists them, not as multiples of input: cache_write_5m
# and cache_write_1h. cached_input is the page's "cache hits and refreshes" price: 0.1 times input
# on most models, 0.05 times on Opus 5.5 and Sonnet 5.5, 0.025 times on Fable 5.2, Mythos 5.2,
# Fable 5.1 and Mythos 5.1.
# Claude Haiku 5.5 is priced by prompt length. Its [long] table holds the rates of a request whose
# prompt is over 100,000 tokens, and Anthropic charges the whole request at them, input and output,
# not only the tokens past the threshold: "a request over the threshold pays the higher prices even
# when part of its prompt is a cache hit", and the prompt length counts cache reads and writes too.
# The other models include the full context window at their standard price, so they have no long table.
# Fast mode is a tiers.fast row for each model the fast mode page prices: Claude Fable 5.2, Mythos 5.2,
# Opus 5.5, Opus 5 and Opus 4.8. The page gives fast input and output only, and says the prompt
# caching multipliers apply on top of fast pricing, so a fast row's cache rates are the page's
# multipliers on the fast input rate: 1.25 for a 5 minute write, 2 for a 1 hour write, and the
# model's cache read multiplier for a hit. Those cache rates are computed, not listed.
# Claude Mythos 5.2 is limited to organizations Anthropic has verified; the page prices it, so it is here.
# Left out on purpose: the Batch API, which is not a tier a reply names; US-only inference
# (inference_geo "us"), which costs 1.1 times and which docs/limits.md says is settled at the normal
# rate; data residency multipliers; and the retired models Opus 4.1, Opus 4 and Sonnet 4, which the
# page marks retired. The page lists no other model without a plain price.

[anthropic]
url = "https://platform.claude.com/docs/en/about-claude/pricing"
as_of = "2026-11-25"

# A web search costs $10 per 1,000 searches on the Claude API, plus the tokens its results use.
[anthropic.fees]
web_search_request = 0.01

