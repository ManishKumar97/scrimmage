# Model prices in dollars per million tokens, standard tier.
# Checked against OpenAI's pricing page on 19 November 2026; a price changes by a plain PR to this file.
# A team overrides or adds a model under [agent.prices] in scrimmage.toml.
# A model with a long-context price, above 272K input tokens, is left out, such as gpt-5.4, gpt-5.5
# and the gpt-5.6 models: one rate per kind of token would price a long call low.
# A missing cached_input costs the full input rate: a price that guesses must guess high.

as_of = "2026-11-19"
source = "https://openai.com/api/pricing/"

[models."gpt-4o"]
input = 2.50
output = 10.00
cached_input = 1.25

# Its own price, not its family's; shut down, so no longer on the pricing page.
# No cached rate: it had no prompt cache discount.
