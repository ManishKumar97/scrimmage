[project]
name = "derail"
version = "0.0.0"
description = "Fault injection for AI agents under test."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["derail-marker"]

[project.scripts]
derail = "derail_sdk.entry:main"
derail-run = "derail_sdk.run_command:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/derail_sdk"]

[tool.uv.sources]
derail-marker = { workspace = true }
