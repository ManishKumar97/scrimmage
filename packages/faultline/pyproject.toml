[project]
name = "faultline"
version = "0.1.0"
description = "Find the silent failures in an AI agent, prove the fix, and stop them from coming back."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
faultline = "faultline.cli:main"

[project.optional-dependencies]
# The model proxy is the only part of the product that needs a third-party package.
# yarl is the URL type aiohttp takes. The proxy builds upstream URLs with it.
proxy = ["aiohttp>=3.14", "yarl>=1.20"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
