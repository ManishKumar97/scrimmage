[project]
name = "faultline-marker"
version = "0.0.0"
description = "Marks tools and runs for Faultline. Does nothing unless faultline is installed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faultline"]
