[project]
name = "scrimmage-core"
version = "0.0.0"
description = "Fault injection for AI agents under test."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scrimmage"]

[project.scripts]
derail = "scrimmage_core.entry:main"
derail-run = "scrimmage_core.run_command:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrimmage_core"]

[tool.uv.sources]
scrimmage = { workspace = true }
