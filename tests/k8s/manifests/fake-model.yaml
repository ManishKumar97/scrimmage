# A fake OpenAI API for the tests, answering from fixture files. Its arguments are the fixtures,
# one per turn of a conversation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-model
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: fake-model}
  template:
    metadata:
      labels: {app.kubernetes.io/name: fake-model}
    spec:
      serviceAccountName: fake-model
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: fake-model
          image: scrimmage-fake-model:TAG
          imagePullPolicy: Never
          args: ["acme_get_order", "acme_get_stock", "acme_answer|acme_admits"]
          ports: [{containerPort: 8080, name: http}]
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
          resources:
            requests: {cpu: 125m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
