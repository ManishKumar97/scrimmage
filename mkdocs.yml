# The product website. Build it with: uv run --group docs mkdocs build --strict
# The product name is written once, in site_name. Pages write it out in their text.
site_name: Scrimmage
site_description: An in-process fault injector for AI agents under test.
repo_url: https://github.com/ManishKumar97/faultline
edit_uri: ""

docs_dir: docs
site_dir: site
# In strict mode, each of these warnings fails the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Get started:
      - Install: install.md
      - Quickstart: quickstart.md
  - Guides:
      - Failing the model: model-faults.md
      - Agents on a framework: frameworks.md
      - An agent run as a script: scripts.md
      - Web requests: web-requests.md
      - MCP tools: mcp.md
      - Judging an answer: judging.md
  - Concepts:
      - Concepts: concepts.md
      - How it works: how-it-works.md
  - Reference:
      - Commands: cli.md
      - Configuration: configuration.md
      - Limits: limits.md
  - Safety and security:
      - Safety: safety.md
