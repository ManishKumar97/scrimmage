name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  # uv run never re-locks; a stale uv.lock fails the job.
  UV_LOCKED: "1"

jobs:
  checks:
    name: Lint, types, dead code, imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      # The checks below run even after one fails, so a PR shows all its problems.
      - name: pyright
        if: ${{ !cancelled() }}
        run: uv run pyright
      - name: vulture
        if: ${{ !cancelled() }}
        run: uv run vulture
      - name: import-linter
        if: ${{ !cancelled() }}
        run: uv run lint-imports

  docs:
    name: Docs site, built strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
      # Strict: a broken link, a missing anchor or a page left out of the nav fails the job.
      - run: uv run --group docs mkdocs build --strict

  system-python:
    name: Startup tests on Ubuntu's Python
    # Pinned, not ubuntu-latest: the tests name Ubuntu 24.04's own Python 3.12, and the
    # newer image ships only Python 3.14 under /usr/bin.
    runs-on: ubuntu-24.04
    env:
      # A distribution's Python has its own sitecustomize, which Scrimmage must chain to.
      UV_PYTHON: /usr/bin/python3.12
      # The system-Python tests run here, so a skip of one fails this job.
      SCRIMMAGE_SYSTEM_PYTHON: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
      # CI fails a skipped test, and the apport test needs Ubuntu's apport hook module.
      - name: Ubuntu's apport hook, and a check that the system Python is the one named
        run: |
          sudo apt-get install -y --no-install-recommends python3-apport
          /usr/bin/python3.12 -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
          test -f /usr/lib/python3.12/sitecustomize.py
      - run: uv sync
      - run: uv run pytest tests/test_other_python.py tests/test_bootstrap.py tests/test_process_gate.py
      # Every test marked needs_system_python, in whatever file it is.
      - run: uv run pytest -m needs_system_python

  tests:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Without this, uv run reads .python-version and rebuilds the venv on 3.11.
      UV_PYTHON: ${{ matrix.python }}
      # Ubuntu's own 3.12 starts each process far more slowly than uv's build.
      UV_PYTHON_PREFERENCE: only-managed
      # NeMo does not install on 3.14 yet, so its tests may skip there and nowhere else.
      SCRIMMAGE_NEMO: ${{ matrix.python != '3.14' && '1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --group nemo
      - name: Check the job runs the Python it names
        run: uv run python -c "import sys; v = '.'.join(map(str, sys.version_info[:2])); assert v == '${{ matrix.python }}', v"
      # Python 3.11's sys.settrace raises RuntimeError in a thread that starts while another
      # thread is in a Python audit hook (gh-98257, fixed in 3.12), and coverage calls it as
      # each thread starts. So 3.11 runs every test with no tracer, and coverage is measured
      # on 3.12 and later. The product has no code that only 3.11 runs.
      # Each job runs the fast tier first, so a broken PR fails in about 2 minutes, then the
      # slow tier. The two runs together collect every test the full suite does.
      - name: Tests, with no coverage tracer
        if: matrix.python == '3.11'
        run: |
          uv run pytest -m "not slow"
          uv run pytest -m slow
      # pytest runs one worker per CPU (-n auto in pyproject.toml). Coverage follows
      # each worker and each child process; combine merges every data file.
      - name: Tests, measuring coverage in every process
        if: matrix.python != '3.11'
        run: |
          COVERAGE_FILE=.coverage.fast uv run coverage run -m pytest -m "not slow"
          COVERAGE_FILE=.coverage.slow uv run coverage run -m pytest -m slow
          uv run coverage combine
          mv .coverage ".coverage.py${{ matrix.python }}"
      # br is undone with the program's own brotli, which the dev group leaves out, so the
      # br tests skip above. This runs them with it, never as a dependency of the package.
      # The variable makes a skip of a marked test fail this step.
      - name: The br tests, with brotli installed
        env:
          SCRIMMAGE_BROTLI: "1"
        run: uv run --with brotli pytest -m needs_brotli
      # The old brotlipy package: httpx unpacks br with it and Scrimmage cannot, so leaves it.
      - name: The br tests, with brotlipy installed
        env:
          SCRIMMAGE_BROTLIPY: "1"
        run: uv run --with brotlipy pytest -m needs_brotlipy
      # Python 3.14 copies context into a new thread only with this flag. The environment
      # variable is the same as -X thread_inherit_context=1, and pytest-xdist's workers keep it.
      - name: The thread tests, with thread_inherit_context on
        if: matrix.python == '3.14'
        env:
          SCRIMMAGE_INHERIT_CONTEXT: "1"
          PYTHON_THREAD_INHERIT_CONTEXT: "1"
        run: uv run pytest -m needs_inherit_context
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: matrix.python != '3.11'
        with:
          name: coverage-${{ matrix.python }}
          path: .coverage.py${{ matrix.python }}
          include-hidden-files: true
          retention-days: 1

  newest:
    name: Newest releases of the gated libraries, on Python 3.14
    # What a team gets from a fresh install, which the lock does not hold: the newest release
    # of each library a gate patches. A new release can break a gate with no commit of ours.
    # The mcp extra caps mcp at 2.3, so mcp upgrades only within that.
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - name: Upgrade the gated libraries past the lock
        run: |
          uv pip install --upgrade openai httpx httpx2 langchain-core langchain-openai langgraph "mcp>=2.3,<2.4"
          uv pip list | grep -E "^(openai|httpx|httpx2|langchain-core|langchain-openai|langgraph|mcp) "
      # --no-sync keeps the upgrade. tests/test_tested_range.py fails when a library is newer
      # than the range its gate was tested with.
      - name: The gate tests, with the newest releases
        run: >-
          uv run --no-sync pytest
          tests/test_tested_range.py tests/test_http_gate.py tests/test_tool_gate.py
          tests/test_langgraph.py tests/test_mcp.py tests/test_model_faults.py
          tests/test_model_replace.py

  coverage:
    name: Branch coverage across the matrix
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: At least 95% of product branches, combined
        run: |
          uv run coverage combine
          uv run coverage report
