name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"

jobs:
  checks:
    name: Lint, types, dead code, imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --python 3.11
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pyright
        run: uv run pyright
      - name: vulture
        run: uv run vulture
      - name: import-linter
        run: uv run lint-imports

  tests:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pytest
