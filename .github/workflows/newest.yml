name: Newest releases

# The newest release of each library a gate patches, run against the gate tests.
# ci.yml calls this on every push and pull request. It also runs once a day, so a release
# that breaks a gate is seen within a day, with no push of ours needed.
# A failed scheduled run goes red on the Actions page, and GitHub emails the owner of the
# schedule, the same as the weekly kind job.
on:
  workflow_call:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"
  # uv run never re-locks; a stale uv.lock fails the job.
  UV_LOCKED: "1"

jobs:
  newest:
    name: Newest releases of the gated libraries, on Python 3.14
    # What a team gets from a fresh install, which the lock does not hold: the newest release
    # of each library a gate patches. A new release can break a gate with no commit of ours.
    # The mcp extra caps mcp at 2.3, so mcp upgrades only within that.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.14"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync
      - name: Upgrade the gated libraries past the lock
        run: |
          uv pip install --upgrade openai anthropic httpx httpx2 langchain-core langchain-openai langgraph "mcp>=2.3,<2.4"
          uv pip list | grep -E "^(openai|anthropic|httpx|httpx2|langchain-core|langchain-openai|langgraph|mcp) "
      # --no-sync keeps the upgrade. tests/test_tested_range.py fails when a library is newer
      # than the range its gate was tested with. tools/gate-tests.txt lists the gate tests.
      - name: The gate tests, with the newest releases
        run: uv run --no-sync pytest $(python3 tools/gate_tests.py)
