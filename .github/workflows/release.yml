name: Release

# A pushed v* tag builds the package once and uploads it to TestPyPI.
# A final version also goes to PyPI, after the maintainer approves the pypi environment.
# Uploads use PyPI trusted publishing: no API token or secret is stored.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  UV_VERSION: "0.13.0"

jobs:
  build:
    name: Build the wheel and sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Build, with the commit time as the file time
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build --package scrimmage -o dist
      # The version is bumped in a commit before the tag. The tag must equal v plus that version.
      - name: The tag must be v plus the built version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import email
          import glob
          import os
          import zipfile

          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              version = email.message_from_bytes(z.read(name))["Version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} is not v{version}: bump the version in a commit, then tag it")
          print(f"tag {tag} matches version {version}")
          PY
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  pypi:
    name: Publish to PyPI
    needs: testpypi
    # A release candidate goes to TestPyPI only.
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true
