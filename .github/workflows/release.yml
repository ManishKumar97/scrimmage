name: Release

# A pushed v* tag builds the package once and uploads it to TestPyPI.
# A final version also goes to PyPI, after the maintainer approves the pypi environment.
# A release candidate (X.Y.ZrcN) goes to TestPyPI only.
# Uploads use PyPI trusted publishing: no API token or secret is stored.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  UV_VERSION: "0.13.0"

jobs:
  build:
    name: Build the wheel and sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The whole history, so the tagged commit can be checked against main.
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # The build tool and its dependencies are exact and hashed.
      - name: Build, with the commit time as the file time
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build --package scrimmage --build-constraints packages/scrimmage/build-constraints.txt --require-hashes -o dist
      # The version is bumped in a commit before the tag. The tag must equal v plus that version.
      # Only X.Y.Z and X.Y.ZrcN pass, so a, b, dev and other spellings of a release candidate fail here.
      - name: The tag must be v plus a release or rc version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import email
          import glob
          import os
          import re
          import zipfile

          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              version = email.message_from_bytes(z.read(name))["Version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} is not v{version}: bump the version in a commit, then tag it")
          if not re.fullmatch(r"\d+\.\d+\.\d+(rc\d+)?", version):
              raise SystemExit(f"version {version} is not X.Y.Z or X.Y.ZrcN")
          prerelease = "true" if "rc" in version else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"prerelease={prerelease}\n")
          print(f"tag {tag} matches version {version}, prerelease={prerelease}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # A separate job: nothing it runs can change the files that get published.
  check:
    name: Check the package metadata
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - run: uvx twine@7.0.0 check --strict dist/*

  testpypi:
    name: Publish to TestPyPI
    needs: [build, check]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  pypi:
    name: Publish to PyPI
    needs: [build, check, testpypi]
    # A release candidate goes to TestPyPI only.
    if: ${{ needs.build.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true
