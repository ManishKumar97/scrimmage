# Grafana datasource provisioning file for `faultline serve`.
# Copy it to Grafana's provisioning/datasources folder and set `url` to where
# `faultline serve` listens, as Grafana's server sees it.
# Needs the Infinity plugin: yesoreyeram-infinity-datasource.
apiVersion: 1
datasources:
  - name: Faultline
    uid: faultline # the dashboard's panels name this uid
    type: yesoreyeram-infinity-datasource
    url: http://localhost:8765
    editable: false
    jsonData:
      # Queries go only to the base URL above.
      allowedHosts:
        - http://localhost:8765
