# Every fault Scrimmage can inject, and where it was seen.
# A fault enters this file in the slice that builds it, never before.
#
# [[fault]]
# name = "timeout"                 # the fault word a team writes in scrimmage.toml
# origin = "public incident"       # "public incident" or "trace"
# source = "https://..."           # the incident's public URL, or a description of
#                                  # the trace with nothing private in it

[[fault]]
name = "timeout"
origin = "public incident"
source = "https://aws.amazon.com/message/101925/ (AWS us-east-1, 19-20 October 2025: DynamoDB endpoints stopped resolving and calls to dependent services timed out for hours)"

[[fault]]
name = "status"
origin = "public incident"
source = "https://status.openai.com/incidents/ctrsv3lwd797 (OpenAI status page, API, ChatGPT and Sora Facing Issues: the API returned elevated errors to every caller)"

[[fault]]
name = "empty"
origin = "public incident"
source = "https://aws.amazon.com/message/101925/ (AWS us-east-1, 19-20 October 2025: a race in DynamoDB's DNS automation left an incorrect empty DNS record for the regional endpoint, so clients found no address to connect to)"

[[fault]]
name = "error"
origin = "public incident"
source = "https://blog.cloudflare.com/18-november-2025-outage/ (Cloudflare, 18 November 2025: a bad configuration file made a core proxy module fail, so services behind it returned errors to their callers)"

[[fault]]
name = "append"
origin = "public incident"
source = "https://invariantlabs.ai/blog/mcp-github-vulnerability (Invariant Labs, 26 May 2025: a malicious issue in a public repository was fetched by the agent through the official GitHub MCP server, and the instructions in it made the agent leak data from private repositories)"

[[fault]]
name = "replace"
origin = "public incident"
source = "https://arxiv.org/abs/2509.10540 (EchoLeak, CVE-2025-32711, disclosed 11 June 2025: hidden instructions in an email, pulled into Microsoft 365 Copilot's context by its normal retrieval, made Copilot send the user's data to an attacker)"

[[fault]]
name = "slow"
origin = "public incident"
source = "https://status.claude.com/incidents/2pt83vlkk7x7 (Anthropic status page, 10 September 2026, Elevated latency on the Claude API for some users: slower than normal response times and some request timeouts, not errors)"

[[fault]]
name = "refused"
origin = "public incident"
source = "https://github.blog/news-insights/the-library/a-note-on-today-s-outage/ (GitHub, 13 October 2009: a file server's load made the frontends time out and leave the load balancer, and with every frontend out of rotation the site gave a connection refused error)"

[[fault]]
name = "reset"
origin = "public incident"
source = "https://github.blog/news-insights/company-news/github-availability-report-march-2026/ (GitHub availability report, 24 March 2026: an outage at an upstream dependency caused HTTP 500 errors and connection resets for the Microsoft Teams integration, whose error rate peaked at 90.1% of requests)"

[[fault]]
name = "dns"
origin = "public incident"
source = "https://aws.amazon.com/message/101925/ (AWS us-east-1, 19-20 October 2025: a latent defect in DynamoDB's automated DNS management caused endpoint resolution failures, so customers and dependent AWS services could not establish new connections)"
