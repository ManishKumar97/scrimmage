# Every fault Scrimmage can inject, and where it was seen.
# A fault enters this file in the slice that builds it, never before.
#
# [[fault]]
# name = "timeout"                 # the fault word a team writes in scrimmage.toml
# origin = "public incident"       # "public incident", "trace" or "provider docs"
# source = "https://..."           # the incident's public URL, or a description of
#                                  # the trace with nothing private in it

[[fault]]
name = "timeout"
origin = "public incident"
source = "https://aws.amazon.com/message/101925/ (AWS us-east-1, 19-20 October 2025: DynamoDB endpoints stopped resolving and calls to dependent services timed out for hours)"

[[fault]]
name = "status"
origin = "public incident"
source = "https://status.openai.com/incidents/ctrsv3lwd797 (OpenAI status page, API, ChatGPT and Sora Facing Issues: the API returned elevated errors to every caller)"

[[fault]]
name = "empty"
origin = "public incident"
source = "https://status.cloud.google.com/incidents/ow5i3PPK96RduMcb1SsW (Google Cloud, 12 June 2025: policy data with unintended blank fields reached Service Control, whose code had no handling for them, so it crashed and Google Cloud APIs returned 503 errors)"

[[fault]]
name = "error"
origin = "public incident"
source = "https://blog.cloudflare.com/18-november-2025-outage/ (Cloudflare, 18 November 2025: a bad configuration file made a core proxy module fail, so services behind it returned errors to their callers)"

[[fault]]
name = "append"
origin = "public incident"
source = "https://invariantlabs.ai/blog/mcp-github-vulnerability (Invariant Labs, 26 May 2025: a malicious issue in a public repository was fetched by the agent through the official GitHub MCP server, and the instructions in it made the agent leak data from private repositories)"

[[fault]]
name = "replace"
origin = "public incident"
source = "https://arxiv.org/abs/2509.10540 (EchoLeak, CVE-2025-32711, disclosed 11 June 2025: hidden instructions in an email, pulled into Microsoft 365 Copilot's context by its normal retrieval, made Copilot send the user's data to an attacker)"

[[fault]]
name = "slow"
origin = "public incident"
source = "https://status.claude.com/incidents/2pt83vlkk7x7 (Anthropic status page, 10 September 2026, Elevated latency on the Claude API for some users: slower than normal response times and some request timeouts, not errors)"

[[fault]]
name = "refused"
origin = "public incident"
source = "https://github.blog/news-insights/the-library/a-note-on-today-s-outage/ (GitHub, 13 October 2009: a file server's load made the frontends time out and leave the load balancer, and with every frontend out of rotation the site gave a connection refused error)"

[[fault]]
name = "reset"
origin = "public incident"
source = "https://github.blog/news-insights/company-news/github-availability-report-march-2026/ (GitHub availability report, 24 March 2026: an outage at an upstream dependency caused HTTP 500 errors and connection resets for the Microsoft Teams integration, whose error rate peaked at 90.1% of requests)"

[[fault]]
name = "bad body"
origin = "public incident"
source = "https://blog.cloudflare.com/incident-report-on-memory-leak-caused-by-cloudflare-parser-bug/ (Cloudflare, 23 February 2017, Cloudbleed: a buffer overrun in an edge parser meant some HTTP requests through Cloudflare got corrupted pages back, holding bytes from other requests' memory)"

[[fault]]
name = "context too long"
origin = "trace"
source = "A real reply from OpenAI's Chat Completions API, 17 November 2026: a gpt-4o-mini request of 140008 tokens got status 400 with code context_length_exceeded and param messages; the body is saved as tests/fixtures/openai/real_error_context_length.json"

[[fault]]
name = "dns"
origin = "public incident"
source = "https://aws.amazon.com/message/101925/ (AWS us-east-1, 19-20 October 2025: a latent defect in DynamoDB's automated DNS management caused endpoint resolution failures, so customers and dependent AWS services could not establish new connections)"

[[fault]]
name = "garble"
origin = "public incident"
source = "https://www.anthropic.com/engineering/a-postmortem-of-three-recent-issues (Anthropic, 25 August to 2 September 2025: a misconfiguration on the Claude API's TPU servers occasionally gave a high probability to tokens that should rarely be produced, so replies to English prompts held Thai or Chinese characters, such as \"สวัสดี\" in the middle of the response, and code held obvious syntax errors)"

[[fault]]
name = "truncate"
origin = "trace"
source = "A real reply from OpenAI's Chat Completions API, 18 November 2026: a gpt-4o-mini request with max_completion_tokens = 5 got status 200, its text cut short, with finish_reason length; the same limit on a request with one tool and tool_choice required got status 400, \"Could not finish the message because max_tokens or model output limit was reached\"; and OpenAI's own text for finish_reason, as the openai Python library 3.46 ships it in types/chat/chat_completion.py: \"length if the maximum number of tokens specified in the request was reached\""

[[fault]]
name = "unknown tool"
origin = "public incident"
source = "https://community.openai.com/t/model-tries-to-call-unknown-function-multi-tool-use-parallel/490653 (OpenAI developer forum, 9 November 2023: the model called multi_tool_use.parallel, a tool the agent never offered) and https://community.openai.com/t/gpt-4-0125-preview-hallucinating-tool-calls/609610 (1 February 2024, gpt-4-0125-preview: the same call, and OpenAI then refused the next request because the name does not match its tool name pattern)"

[[fault]]
name = "bad tool args"
origin = "provider docs"
source = "OpenAI's own text for a tool call's arguments, as the openai Python library 3.46 ships it in types/chat/chat_completion_message_function_tool_call.py: \"the model does not always generate valid JSON, and may hallucinate parameters not defined by your function schema\"; and https://community.openai.com/t/malformed-jsons-in-gpt-4-1-mini/1286180 (OpenAI developer forum, 12 June 2025: gpt-4.1-mini on the Responses API sent tool arguments that are not valid JSON)"

[[fault]]
name = "refuse"
origin = "provider docs"
source = "https://developers.openai.com/api/docs/guides/structured-outputs (OpenAI's Structured Outputs guide: a refusal is a refusal field, with the example \"I'm sorry, I cannot assist with that request.\") and https://community.openai.com/t/the-refusal-in-the-api-is-always-null/922367 (OpenAI developer forum, 26 August 2024: gpt-4o-mini with no structured output refused in content, \"I'm sorry, I can't assist with that.\", with refusal null)"
