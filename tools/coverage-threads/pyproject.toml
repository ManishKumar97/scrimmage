[project]
name = "coverage-threads"
version = "0"
description = "Test support for this repository: keeps coverage.py from deleting other threads' imports. Never published."
requires-python = ">=3.11"
dependencies = ["coverage>=7.17"]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverage_threads"]
